[[entry]]
id = 6
type = "story"
title = "Write grants: dialog, revoke and listing"
description = "Completes AD-6 for notebooks: the elicitation dialog for write grants, `grant --revoke` for notebooks, list_grants showing write grants as active or notebookNotOpen, the NotebookKey and SectionKey amendments from entry 3, and R4 (purge takes the settings mutex and warns about running servers); it shares ToolRunner.cs with entry 5 and uses the existing WriteNotGranted text."
verify = "From Claude Code, create_page on an ungranted notebook raises the dialog, Phill types the name and the write goes through, list_grants shows the grant, and unit tests cover ambiguous names, decline and revoke."
covers = ["R4"]
after = [5]
hitl = true
risk = "high"
unknown = "How elicitation behaves in Claude Code for a write."

[[entry]]
id = 7
type = "story"
title = "Write gateway, timeouts and error map"
description = "Adds UpdatePageContent and DeletePageContent to the port and both gateways, the AD-3 gateway-side write rules (ComBusy while an abandoned write is outstanding, busy retries confirmed safe for writes), and the whole HRESULT triage in HResultMap (the page-write codes from entry 3, the 23 untriaged codes and hrDisabledByPolicy); it shares ToolErrors.cs with entry 5."
verify = "Unit tests map each triaged HRESULT and cover the abandoned-write rule, and an integration test calls both methods on an MCP Test page through the guard."
covers = ["R4", "R6"]
after = [5]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "Journal"
description = "Builds AD-8's writer (gzip JSON written to a temp file and renamed, binaryComplete and missingBinary, pruning by age and size at startup and daily), the pipeline's page-snapshot step, JournalFailed aborting the write, and DPAPI-encrypted entries for protected sections per entry 3; it shares the pipeline runner with entry 6."
verify = "Unit tests cover the entry format, a DPAPI entry, retention and the size cap against a temp folder, and a write whose snapshot fails is refused."
covers = ["R5"]
after = [6]
hitl = false
risk = "high"

