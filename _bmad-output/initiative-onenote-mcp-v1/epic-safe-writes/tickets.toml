# tickets.toml — epic-safe-writes ("Safe page writes"). Table order is the build order.
# Agreed at inception, 2026-11-09 (Phill). The draft and its reviews are in review/.

[[entry]]
id = 1
type = "story"
title = "Opening refactor"
description = "Clears the epic 1 retrospective's \"epic 2 first refactor\" group before write code lands beside it: D1–D5, P2 with an .editorconfig rule, P3 (the only behaviour change: the XPSFile probe stops swallowing Timeout and Cancelled), S2 (split ReadAccess), S3 and A3 (the grant CLI's EncryptedSections call moves behind Core)."
verify = "All suites pass, the stress harness on MCP Test shows 0 mismatches, a P3 test fails on the old code, and a security review of the ReadAccess split finds no change in who can read what."
covers = ["R4"]
after = ["1.14"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-onenote-mcp-v1/deferred-work.md", "_bmad-output/initiative-onenote-mcp-v1/epic-read-only-release/epic-read-only-release-retrospective.md"]

[[entry]]
id = 2
type = "spike"
title = "Write probes, part 1: pages, paths and search"
description = "Phill first creates the throwaway OneDrive notebook \"MCP Test Cloud\" (one page with an image that isn't downloaded) and the integration guard is widened to allow it; then probes on MCP Test and MCP Test Cloud settle page-write behaviour (merge by objectID, ignored edits and read-back, a cloud image dropped on Outline replace, side effects, ModalDialogOpen per method, HRESULTs), the dates UpdatePageContent and DeletePageContent accept, the Column/@width and pathCache hash quirks, xs2026 and merged cells, notebook and section path stability, and the Q5 search probe."
verify = "A findings doc gives one probe result per question and its constraints are logged in the spine memlog, with Phill present for the live writes."
covers = ["R4", "R6"]
after = ["1.14"]
hitl = true
risk = "high"
unknown = "Everything it probes; the width quirk was seen only on a real notebook and may not reproduce."
references = ["_bmad-output/initiative-onenote-mcp-v1/epic-read-only-release/research-onemore-lessons.md", "spikes/stress-harness/README.md"]

[[entry]]
id = 3
type = "story"
title = "Spine amendments from the page-write probes"
description = "Amends the spine from entry 2's findings and the inception decisions: AD-4 schema, AD-7 read-back and image refusal, AD-9 page-write HRESULTs and InvalidArgument, AD-16 gate, AD-17 hash exclusions and element-delete comparison, AD-6/AD-21 NotebookKey and SectionKey, and writes in protected sections (AD-6, AD-7, AD-8, AD-9, AD-10, AD-21: both grants, DPAPI journal entries, restore only into the same section, the dialog order, whether a once grant covers a write, whether create_page needs the read grant, restore into a locked or missing section), plus the Deferred rows."
verify = "The Fable final review has run and Phill has approved the amended spine."
covers = ["R4", "R5", "R6"]
after = [2]
hitl = true
risk = "high"
unknown = "What the spike finds."

[[entry]]
id = 4
type = "story"
title = "Tracer: create_page through the write pipeline"
description = "The tracer bullet: the AD-7 step runner with the Create class's steps and deadline, the Local\\OneNoteMcp.Write mutex, the notebooks{} settings model with `grant --write <notebook>` that Phill runs, CreateNewPage on the port and both gateways, a create_page tool with Create validation, outcomeUnknown on Timeout/ComUnavailable/Cancelled, cache eviction, the NewerSchema advice, and the two readOnlyHint checks (the harness's and NavigateToToolTests) updated for write tools."
verify = "After Phill runs `grant --write \"MCP Test\"`, create_page from Claude Code adds a page there, an ungranted notebook returns WriteNotGranted, a two-process integration test shows writes never interleave, and the harness passes."
covers = ["R4", "R6"]
after = [1]
hitl = true
risk = "high"

[[entry]]
