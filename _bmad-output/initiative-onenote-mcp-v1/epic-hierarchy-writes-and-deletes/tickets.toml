# tickets.toml — epic-hierarchy-writes-and-deletes. Table order is the build order.
# Agreed at epic 2's inception, 2026-11-09 (Phill). The draft is in ../epic-safe-writes/review/.

[[entry]]
id = 1
type = "spike"
title = "Write probes, part 2: hierarchy, delete and backup"
description = "Probes on MCP Test, extending epic 2's probe code: OpenHierarchy create, UpdateHierarchy add/rename/reorder, DeleteHierarchy soft and permanent on a page, section, section group and notebook, a soft delete in a protected section and a protected section deleted whole, Publish in pfOneNote format, the date DeleteHierarchy accepts, and ModalDialogOpen and HRESULTs per method."
verify = "A findings doc gives one probe result per question and its constraints are logged in the spine memlog, with Phill present for the live writes."
covers = ["R4", "R5", "R6"]
after = ["2.2"]
hitl = true
risk = "high"
unknown = "Everything it probes."

[[entry]]
id = 2
type = "story"
title = "Spine amendments from the hierarchy probes"
description = "Amends AD-7, AD-8, AD-9 and AD-21 from entry 1's findings and updates the Deferred rows; it edits the spine after epic 2's entry 3. It also records two of Phill's decisions for epic 3 (2026-11-12): a cautious rule that refuses moves and merges out of a protected section (the Deferred row from Fable H1; epic 3's 3.2 may relax it with 3.1's evidence), and a journal field in AD-8 and AD-10 holding a soft-deleted page's recycle-bin ID, which entry 5 writes."
verify = "The Fable final review has run and Phill has approved the amended spine."
covers = ["R4", "R5", "R6"]
after = [1, "2.3"]
hitl = true
risk = "high"
unknown = "What the spike finds."

[[entry]]
id = 3
type = "story"
title = "Create: section, section group and notebook"
description = "OpenHierarchy create through the Create class, building on the section creation from epic 2's entry 11: by parent ID with the parent-exists-and-not-locked check, a notebook at a path checked empty, its automatic grant under the settings mutex inside the write mutex, and createdNotGranted; OpenHierarchy on an existing path stays AppState (epic 4)."
verify = "On MCP Test each kind is created, and a new notebook shows in list_grants as grantedVia: created; a security review of the diff runs before merge."
covers = ["R4", "R6"]
after = [2, "2.11"]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Rename and reorder: update_hierarchy"
description = "UpdateHierarchy add, rename and reorder (not move) through HierarchyWrite: the XSD check, the IDs exist, the lastModifiedTime basis check, and a hierarchy snapshot; it shares tool registration and the contract with entry 3. It also changes the three HResultMap rows AD-9 remaps (0x80042017, 0x80042024, 0x8004202E; Phill, 2.7 plan Q2)."
verify = "On MCP Test a rename lands, a rename whose basis date has moved returns StaleWrite, and the journal holds the hierarchy snapshot."
covers = ["R4", "R5", "R6"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Soft delete"
description = "DeleteHierarchy permanent=false for a page, section or section group with a page or hierarchy snapshot, following entry 2's rules (AD-7 SoftDelete, AD-21): a notebook is refused with NotSupported, and in a protected section the write grant alone is enough, but a page soft delete there stays refused until this story probes it with the hierarchy date; after a page delete it reads back the page's new recycle-bin ID and stores it in the journal entry, for epic 3's restore_from_recycle_bin (Phill, 2026-11-12)."
verify = "On MCP Test a deleted page is in the recycle bin with a journal entry holding its recycle-bin ID, restore_from_journal brings it back, and a stale basis returns StaleWrite on a page that isn't displayed."
covers = ["R4", "R5", "R6"]
after = [4]
hitl = false
risk = "high"
unknown = "How to pick out the deleted page's new ID in Deleted Pages when two pages there share its name."

[[entry]]
id = 6
type = "story"
title = "Permanent delete"
description = "The permanent-delete grant (CLI, dialog, listing) and DeleteHierarchy permanent=true: a page gets a full page snapshot, and a section gets a Publish backup in the journal's backups folder first, under Publish's 300 s timeout and the 600 s pipeline deadline, with BackupFailed refusing the delete. A non-empty section group, a notebook, a password-protected section and a page already in the recycle bin are refused with NotSupported (entry 2, AD-7 PermanentDelete). It probes a stale date on a permanent delete before relying on it."
verify = "On MCP Test, without the second grant the delete returns PermanentDeleteNotGranted, with it a backup file exists before a section is gone, a forced backup failure refuses the delete, and a security review of the diff runs before merge."
covers = ["R4", "R5", "R6"]
after = [5]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "Skill, README and harness for hierarchy writes"
description = "The guide skill's recipes for create, rename, reorder and delete, the README on permanent delete and backups, and the stress harness's write-tool list and contract check for the new tools."
verify = "Plugin validation and the harness pass, and after Phill grants through the CLI an agent following the README runs a permanent delete on MCP Test."
covers = ["R4", "R5", "R6"]
after = [6]
hitl = true
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scoped at its start from the build records and the review findings deferred during the epic."
verify = "All suites pass, the harness shows 0 mismatches, and no behaviour changes."
covers = ["R4"]
after = [7]
hitl = false
risk = "medium"
unknown = "Its scope, set when it starts."
