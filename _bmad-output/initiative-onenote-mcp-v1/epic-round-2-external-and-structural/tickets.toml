[[entry]]
id = 3
type = "story"
title = "Tracer: publish a page to PDF under an export root"
description = "The tracer bullet: the ExternalWrite pipeline, the export-root handling E1 sets (building on the exportRoots parsing and default settings already have; entries 13, 7, 8 and 9 reuse it), pfPDF on the port and both gateways beside the Publish method 5.6 added for backups, and a publish tool for a page to PDF only, with E8's rule for a page in a protected section."
verify = "From Claude Code, Phill exports an MCP Test page to PDF and opens the file at the reported meta.outputPath; integration tests with an overridden export root show ExportPathNotAllowed for a path outside it, FileExists for an existing file, and a page in the locked protected section refused as SectionLocked, or ReadNotGranted if entry 2's rule asks for a read grant first; unit tests cover the unlocked path."
covers = ["E1", "E2", "E8"]
after = [2]
hitl = true
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Move a page"
description = "The move tool entry 2 specifies (Q2), for pages: to another section of the same notebook or of another notebook, with every rule E5 sets, building on 5.4's update_hierarchy and its HierarchyWrite pipeline; entries 12, 5 and 6 reuse its multi-notebook grant check, its use of E8's refusal, and the second test notebook it sets up (the epic's Notes, test fixtures)."
verify = "On MCP Test a page moves to another section and to a section in a throwaway test notebook, each with a journal entry and its current ID in the result, a move into an ungranted notebook returns WriteNotGranted, and an integration test shows a page in the locked protected section refused as E8 says; unit tests cover the unlocked path."
covers = ["E5", "E8"]
after = [3]
hitl = false
risk = "high"
unknown = "Whether sending the source section without the page moves it or deletes it, and whether the page keeps its ID; entry 1 settles both."

[[entry]]
id = 12
type = "story"
title = "Move a section or section group"
description = "Extends entry 4's move to sections and section groups, within a notebook and across notebooks, with E5's rules and what entry 2 says a section move does to the section's SectionKey (read grants, protected journal entries), and closes epic 2's create-page race by re-resolving a write's notebook under the write lock."
verify = "On MCP Test a section and a section group move to another group and a section moves to a throwaway test notebook, each with a journal entry; a unit test shows create_page re-resolving its notebook under the lock after a section moves between notebooks; an integration test shows the locked protected section's move refused or handled as entry 2 says (Q14); and Phill checks that a section moved on MCP Test Cloud synced."
covers = ["E5", "E8"]
after = [4]
hitl = true
risk = "high"
unknown = "Whether a section or section group moves across notebooks through UpdateHierarchy, and whether a group move syncs on OneDrive; entry 1 settles both."

[[entry]]
id = 5
type = "story"
title = "restore_from_recycle_bin"
description = "Brings a soft-deleted page or section out of the recycle bin by the route entry 1 proves, with E7's rules, Q3's choice and Q4's target, using the recycle-bin ID 5.5 stores in the journal entry (falling back to the name when that ID is missing or gone) and the move code from entries 4 and 12; a recycled protected section comes back still protected, into nothing but its own place."
verify = "On MCP Test, a page and a section soft-deleted with epic 5's tool come back where they were with a journal entry each, two recycled pages with the same name lead to a choice rather than a guess, an integration test shows the locked recycled protected section handled as E8 says, after Phill unlocks a protected section once so the test can soft-delete it."
covers = ["E7", "E8"]
after = [12]
hitl = true
risk = "high"
unknown = "Whether COM can restore from the recycle bin at all. If entry 1 finds no route, entry 2 records a dated Decision, this entry is dropped with Phill's agreement, and entry 6 goes after entry 12."

