# tickets.toml — epic-round-2-external-and-structural ("Round 2: exports, move and merge"). Table order is the build order.
# Drafted in an autonomous inception, 2026-11-12, for Phill's review. Not yet approved; the open questions are in the epic's Notes.

[[entry]]
id = 1
type = "spike"
title = "Write probes, part 3: exports, move, merge and recycle-bin restore"
description = "Probes on MCP Test and MCP Test Cloud, extending 5.1's probe code and asking only what spike 1 and 5.1 left open (epic Notes): Publish in each other format for a page, section and notebook, with timings, when the file lands and protected sections (unlocked, locked, inside a package); OpenPackage into an existing or non-empty folder, its focus, and protected sections inside the package; what MergeFiles does with three .one files; MergeSections within and across notebooks (does the source survive, page IDs, protected source or destination, and whether merging an opened backup of an unprotected section shows its pages, as OneMore's import does; never a protected section's backup, which opening writes in the clear); UpdateHierarchy moving a page to another section (does sending the source section without it delete or move it), a section to another notebook, a section group, local and cloud with a Sync Now check after each cloud step, with IDs, dates and paths of the item and both parents (a moved section's path is its SectionKey); restoring a recycled page and section through UpdateHierarchy and what triggers 0x8004202E; and the modal-dialog result and HRESULTs per method."
verify = "A findings doc gives one probe result per question, says which earlier findings it relied on instead of re-probing, and logs its constraints in the spine memlog, with Phill present for the live writes."
covers = ["E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8"]
after = ["5.1"]
hitl = true
risk = "high"
unknown = "Everything it probes; no documented route exists for restoring from the recycle bin, and MergeFiles may do nothing useful here."
references = ["_bmad-output/initiative-onenote-mcp-v1/epic-hierarchy-writes-and-deletes/spike-write-probes-part-2-hierarchy-delete-and-backup-findings.md", "_bmad-output/initiative-onenote-mcp-v1/epic-read-only-release/research-onemore-lessons.md"]

[[entry]]
id = 2
type = "story"
title = "Spine amendments for round 2"
description = "Amends the spine from entry 1's findings and the answers to the epic's open questions Q1–Q8: AD-7 (the ExternalWrite pipeline and its grant for protected content, the move, merge and restore validation and snapshots, the move tool's shape), AD-3 (timeouts for the new methods), AD-8 (restore_from_recycle_bin's choice and target, what a section move does to protected journal entries, and where a working backup-restore route from entry 1 goes), AD-9 (codes for the new HRESULTs, 0x80042031 hrPublishFormatUnsupportedForLabels included), AD-10 and AD-11 (export roots), AD-14 (the move tool's name, an exception to its snake_case rule since update_hierarchy is taken), AD-17 (the basis for a move and a merge), AD-21 (exports, and what a section move does to its read grant), the Deferred rows on move and merge, and a dated Decision for any round-2 method not exposed; it keeps 5.2's rule for moves and merges out of a protected section, revising it only where entry 1's evidence contradicts it, and edits the spine after epic 5's entry 2."
verify = "The Fable final review has run and Phill has approved the amended spine."
covers = ["E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9"]
after = [1, "5.2"]
hitl = true
risk = "high"
unknown = "What the spike finds, and Phill's answers to Q1–Q8."

[[entry]]
id = 3
type = "story"
title = "Tracer: publish a page or section under an export root"
description = "The tracer bullet: the ExternalWrite pipeline (write lock, the 600 s publishing deadline, no grant except entry 2's rule for protected content), export-root handling in Core, building on the exportRoots parsing and default that settings already have (the default Documents\\OneNote Exports created on first use, the target made canonical with junctions resolved and then checked, ExportPathNotAllowed and FileExists before COM, the target folder created before the call, a locked section refused as SectionLocked before COM since Publish would return a misleading 0x80042014, success only once the file exists), the other Publish formats on the port and both gateways, building on the Publish method epic 5's entry 6 adds for backups, and a publish tool for a page or section in the formats entry 2 lists, returning meta.outputPath; later export stories reuse this export-root code."
verify = "From Claude Code, Phill exports an MCP Test page to PDF and sees the file at the reported meta.outputPath; integration tests with an overridden export root show a path outside it returns ExportPathNotAllowed, an existing file FileExists, and a protected section handled as entry 2 says."
covers = ["E1", "E2", "E8"]
after = [2, "5.6"]
hitl = true
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Move a page, section or section group"
description = "The explicit move entry 2 specifies (Q2), through HierarchyWrite on top of epic 5's update_hierarchy: the write grant of every notebook touched, resolved through the gateway (AD-6), the basis check entry 2 sets, a hierarchy snapshot of both parents, the rule 5.2 sets (as entry 2 may revise it) for content leaving a protected section, what entry 2 says a section move does to its read grant and protected journal entries, refusing a move into or out of the recycle bin (restore is entry 5), reporting the moved item's ID read back after the move, while update_hierarchy keeps refusing any ID that isn't already under its parent (5.1 constraint 4), and dropping moved pages from the search cache, in code entries 5 and 6 reuse; it also closes deferred-work's create-page race by re-resolving the target's notebook under the write lock, since this tool makes a move between notebooks possible."
verify = "On MCP Test a page moves to another section and a section to another section group with a journal entry each, a move into a second test notebook that isn't granted returns WriteNotGranted, an integration test shows a move out of a protected section handled as 5.2 and entry 2 say, and Phill checks that one cloud move synced."
covers = ["E5", "E8"]
after = [3, "5.4"]
hitl = true
risk = "high"
unknown = "Whether a move across notebooks works through UpdateHierarchy, and whether a moved page keeps its ID; entry 1 settles both."

[[entry]]
id = 5
type = "story"
title = "restore_from_recycle_bin"
description = "Brings a soft-deleted page or section out of the recycle bin with the route entry 1 proves and entry 2 specifies: it takes the recycled item's ID, or a name with the choice among several matches that entry 2 sets (Q3), puts the item under its original parent found from its soft-delete journal entry, or under the caller's target (Q4), needs the write grant of the notebook it restores into, follows the rule 5.2 sets for a protected section, and reports the restored item's ID; it reuses entry 4's move code."
verify = "On MCP Test, a page and a section soft-deleted with epic 5's tool come back where they were, two recycled pages with the same name lead to a choice rather than a guess, and each restore leaves a journal entry."
covers = ["E7", "E8"]
after = [4, "5.5"]
hitl = false
risk = "high"
unknown = "Whether COM can restore from the recycle bin at all (if entry 1 finds no route, entry 2 records a dated Decision and this entry is dropped with Phill's agreement), and how a recycled page, which has a new ID, is matched to its soft-delete journal entry (open question Q10)."

