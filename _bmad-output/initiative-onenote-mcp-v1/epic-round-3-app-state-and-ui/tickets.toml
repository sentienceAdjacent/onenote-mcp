[[entry]]
id = 4
type = "story"
title = "close_notebook"
description = "CloseNotebook through the AppState pipeline as the spine's AD-7 `close_notebook` sets it: never passing force (Q1), needing no grant (Q2), under the write lock, and with the 30 s call timeout. A notebook ID only: a wrong-kind ID is InvalidArgument and an ID no open notebook has is ObjectNotFound, both before COM. Under the lock it runs SyncHierarchy on the notebook, waits a fixed settle of about 10 s, then calls CloseNotebook (OQ2 b, against spike 4.1 C2's lost local edit); a failure before CloseNotebook closes nothing and is never outcomeUnknown, and a CloseNotebook timeout is outcomeUnknown and keeps the lock until it settles (AD-18). It drops nothing from the search cache (OQ6 a). The result gives the notebook's name and path, says it synced and waited first, that every ID changes on reopen, that OneNote's view may go blank, how to reopen it (open_notebook locally, OneNote for a cloud notebook) and that its grants survive. The integration guard, which epic 3 opened to closing -unpacked notebooks, is extended to 5.1's throwaway notebooks b, c and Cloud. The cloud close is done live with Phill, because it shows OneNote's modal \"syncing changes\" box (spike 4.1 C2 C)."
verify = "An integration test closes MCP Test Throwaway b (not the notebook on screen) and the harness's own COM seam reopens it by path, after which list_grants shows its test grant active again; the tool refuses a section ID with InvalidArgument and an unknown ID with ObjectNotFound before COM, and the integration guard refuses to close MCP Test; unit tests on FakeGateway cover the sync-then-settle-then-close order, a SyncHierarchy failure or cancel before the close (not closed, not outcomeUnknown), a CloseNotebook timeout (outcomeUnknown, lock held) and the refusals. Live with Phill: a line added with update_page_content to a page in MCP Test Throwaway b straight before close_notebook is still on that page after the reopen, which settles the settle's length and must hold before the story ships; and Phill notes every other open notebook's Sync Status, closes MCP Test Throwaway Cloud from Claude Code with an edit waiting to sync, sees the syncing box close by itself, reopens it in OneNote straight after, checks with Sync Now that the edit is there, notes every other notebook's Sync Status again, and reports 0xE0000644 or any \"Incomplete sync\" if it appears."
covers = ["A1", "A3"]
after = [3]
hitl = true
risk = "high"
unknown = "Whether SyncHierarchy saves a local notebook and whether a 10 s settle is enough (the sitting measures it; spine Deferred); what Cancel on the cloud syncing box does; which HRESULT a refused CloseNotebook returns; why other notebooks went to \"Incomplete sync\" in spike 4.1 (spine Deferred)."

