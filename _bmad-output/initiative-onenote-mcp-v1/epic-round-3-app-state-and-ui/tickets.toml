id = 1
type = "spike"
title = "App-state probes: open, close, sync, windows, links and quick filing"
description = "Probes, on MCP Test, MCP Test Cloud and 5.1's throwaway notebooks b, c and Cloud with the probe harness 2.2 and 5.1 built, each question in the epic's Notes under \"Unknown, settled by entry 1\", and only those, with a Sync Now check after each cloud step and Phill present for every call that takes focus, shows a dialog or changes a OneNote option."
verify = "A findings doc gives one probe result per question, names the earlier findings it relied on instead of re-probing, records any OneNote option Phill restored by hand, and logs its constraints in the spine memlog."
covers = ["A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9"]
after = []
hitl = true
risk = "high"
unknown = "Everything it probes; above all whether QuickFiling's callback reaches our 64-bit STA thread (OneMore receives it across processes from an MTA), and what CloseNotebook does with changes not yet synced."
references = ["_bmad-output/initiative-onenote-mcp-v1/epic-hierarchy-writes-and-deletes/spike-write-probes-part-2-hierarchy-delete-and-backup-findings.md", "_bmad-output/initiative-onenote-mcp-v1/epic-read-only-release/research-onemore-lessons.md"]

