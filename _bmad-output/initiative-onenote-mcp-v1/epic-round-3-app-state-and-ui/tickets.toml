# tickets.toml — epic-round-3-app-state-and-ui ("Round 3: app state and UI"). Table order is the build order.
# Drafted in an autonomous inception, 2026-11-12, for Phill's review: the questions under "Needs Phill" in the epic's Notes are open, and the entries they touch say so.
# Cross-epic waits: the epic file's `after` gates every entry on epic 3 being done (and so on epics 2 and 5, which epic 3 waits on), so entries name other epics' stories only as what they build on, never in `after`.
# One lane: every story after the spine amendment touches the gateway port, the tool registration and contract snapshot, and the skill.

