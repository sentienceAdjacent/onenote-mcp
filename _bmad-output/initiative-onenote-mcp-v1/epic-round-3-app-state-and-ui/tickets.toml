[[entry]]
id = 14
type = "story"
title = "Keep integration tests that open or close a throwaway from running at once"
description = "Test-only fix. In story 4.11's live sitting (2026-11-26), the integration tests run with ONENOTE_MCP_INTEGRATION=1 and filtered to SyncHierarchy, CloseNotebook and OpenNotebook skipped CloseNotebook_ThrowawayB_ClosesIt_ReopensByPath_AndItsWriteGrantIsActiveAgain with \"Open the throwaway notebook ... first\": xUnit runs test classes in parallel, and OpenNotebookIntegrationTests closed and reopened the same notebook, MCP Test Throwaway 1112-034716 b, at the same time. Run alone, the CloseNotebook filter passed 2 of 2. This story puts every integration test class that closes, opens or otherwise changes the open state of a throwaway notebook into one shared xUnit collection, so those classes never run at the same time. It first checks which classes need it: CloseNotebookIntegrationTests and OpenNotebookIntegrationTests at least, then the sync, quick filing and any other classes that touch throwaways b, c or a (a class that opens and closes a package copy beside throwaway a counts if it changes what another class expects to be open). It adds a cheap unit-level or reflection test, if one can be written, that fails when a class in the integration project closes or opens a notebook but is not in the collection. No product code changes, and no test's assertions change."
verify = "With Phill present and ONENOTE_MCP_INTEGRATION=1, one integration run filtered to SyncHierarchy, CloseNotebook and OpenNotebook passes with no skips; the unit and integration suites without the variable still pass; and the guard test, if one was added, fails when the collection attribute is removed from one of the classes."
covers = ["A3", "A4"]
after = [5]
hitl = true
risk = "low"
unknown = "Which classes beyond CloseNotebook and OpenNotebook change a throwaway's open state, and whether a reflection test can tell them apart from classes that only read or write pages."
references = ["_bmad-output/initiative-onenote-mcp-v1/epic-round-3-app-state-and-ui/story-refactor-sweep-plan.md"]
