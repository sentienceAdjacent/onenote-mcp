[[entry]]
id = 4
type = "story"
title = "close_notebook"
description = "CloseNotebook through the AppState pipeline with the force rule Q1 sets and the grant rule Q2 sets, under the write lock: a notebook ID only (anything else refused before COM), the notebook's pages dropped from the search cache, and a result that gives the notebook's name and path so it can be reopened and warns that every ID in it changes when it reopens; a close that OneNote holds behind its syncing dialog reported as Timeout with outcomeUnknown; and the integration guard, which epic 3 opened to closing -unpacked notebooks, extended to close 5.1's throwaway notebooks b, c and Cloud too."
verify = "An integration test closes MCP Test Throwaway b and the harness's own COM seam reopens it by path, after which list_grants shows its test grant active again; the tool refuses a section ID or an unknown ID before COM, and the integration guard refuses to close MCP Test; a unit test on FakeGateway covers the Timeout path; and Phill closes MCP Test Throwaway Cloud from Claude Code with a change waiting to sync and sees what entry 2 says happens."
covers = ["A1", "A3"]
after = [3]
hitl = true
risk = "high"
unknown = "What CloseNotebook does with changes not yet synced, with and without force, including whether it blocks behind the syncing dialog (entry 1), and so the force rule (Q1)."

[[entry]]
id = 5
type = "story"
title = "open_notebook"
description = "OpenHierarchy on an existing path through the AppState pipeline, never creating (cftNone, with the path checked to exist under the write lock, AD-7): the path forms Q3 allows, refusing before COM a package (open_package's job), a missing path and a folder with no .onetoc2, an already-open notebook answered with its current ID from the hierarchy without calling COM, no grant given though an existing grant for that path applies (AD-6), AD-21's rule for what it opens (Q3, epic 3's Q11), the opened notebook's ID and name in the result, and a warning that a cloud notebook may still be filling."
verify = "An integration test reopens MCP Test Throwaway b after entry 4 closes it, by path, and gets its new ID; an already-open notebook returns its current ID with no COM call (FakeGateway records none); a missing path, a .onepkg and an existing folder that isn't a notebook are refused before COM and nothing is created in that folder; list_grants shows the throwaway's test grant active after the reopen; if entry 1 shows a OneDrive URL works, MCP Test Throwaway Cloud reopens by URL with the still-filling warning; a notebook under the test export root reads as protected (ReadNotGranted) until it has a read grant; unit tests cover the unlocked path."
covers = ["A1", "A4"]
after = [4]
hitl = false
risk = "medium"
unknown = "Whether OpenHierarchy takes a OneDrive URL, and how long a cloud notebook takes to fill (entry 1)."

