description = "The tracer bullet: the AppState pipeline entry 2 sets, including which calls take the write lock (the epic's Source conflict on AD-7 step 2 and AD-18), built beside epic 2's write pipeline; SyncHierarchy on the port, ComGateway and FakeGateway; a sync_hierarchy tool whose result says the sync was requested, not that it finished (spike 1.15 saw S_OK in 0 ms); and navigate_to moved onto the same pipeline with its behaviour unchanged."
verify = "From Claude Code, Phill asks for MCP Test Cloud to sync and gets ok, then checks with Sync Now that the notebook shows no sync error; an integration test syncs MCP Test and a section and page in it; unit tests on FakeGateway cover the pipeline's timeout (outcomeUnknown, no retry) and ModalDialogOpen paths, and navigate_to's existing tests still pass."
