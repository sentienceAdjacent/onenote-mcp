title = "Gateway lifecycle, read-side port and integration harness"
description = "Implements AD-3 in ComGateway (timeouts, poison-and-replace, bounded abandoned threads, reconnect, busy backoff, not-running and integrity checks, idle release), declares all ten Read-class methods on IOneNoteGateway and ComGateway, and adds the opt-in integration suite with an MCP Test notebook created in a scratch folder through a guarded test-only write path compiled into the integration suite only."
verify = "The integration suite passes not-running, modal dialog, OneNote restart (reconnect), forced hang (replacement) and elevation mismatch (refused) scenarios against real OneNote, and unit tests cover the lifecycle state machine with a fake COM layer."
