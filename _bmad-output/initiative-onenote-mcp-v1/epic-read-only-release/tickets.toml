title = "Read grant for password-protected sections"
description = """Implements story 16's read-grant AD: the grant store, plus a command and confirmation that the model can't answer for itself. It guards every read tool for sections with encrypted="true":
- target-scoped reads return ReadNotGranted, after raising the elicitation dialog when the client supports it: get_page_content and get_binary_page_content; get_hierarchy_parent on a page; both hyperlink tools on a page or an object in a page; get_hierarchy at scope children or pages on the section, or on a page in it;
