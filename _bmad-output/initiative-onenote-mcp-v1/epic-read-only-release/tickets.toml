# tickets.toml — epic-read-only-release. Table order is the build order.

[[entry]]
id = 1
type = "spike"
title = "What can the OneNote desktop COM API do on this machine?"
description = "Probes the OneNote COM API for read, write, search and failure behaviour, and compares C# and Python MCP hosts calling it, so the architecture spine can commit to facts."
verify = "The findings doc has a capability matrix with a probe result per row, the HRESULTs observed, and a stack recommendation; its constraints are logged in the architecture memlog."
covers = ["R3"]
after = []
hitl = true
risk = "medium"
unknown = "Whether the M365 COM API still supports every IApplication method, and how each MCP SDK hosts an STA COM object."
references = ["_bmad-output/initiative-onenote-mcp-v1/architecture-onenote-mcp/architecture-onenote-mcp.md"]

