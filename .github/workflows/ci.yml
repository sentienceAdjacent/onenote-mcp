name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OneNoteMcp.slnx

      - name: Build
        run: dotnet build OneNoteMcp.slnx --no-restore -c Release -warnaserror

      # Unit tests only: the integration suite needs a real OneNote and is opt-in (AD-16).
      - name: Test
        run: dotnet test tests/OneNoteMcp.Tests --no-build -c Release

      # The integration project's pure tests (sanitiser, guard). Its OneNote tests skip without ONENOTE_MCP_INTEGRATION.
      - name: Test (integration project, offline tests)
        run: dotnet test tests/OneNoteMcp.Integration --no-build -c Release

      # Plugin packaging (AD-15): pack the zip, then validate the marketplace and the staged plugin.
      # A marketplace validate checks only an archive entry's fields, so the staged plugin is validated too.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Pinned so a validator change can't break a green build unannounced. Bump it deliberately.
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.318

      - name: Pack plugin
        run: pwsh -NoProfile -File scripts/pack-plugin.ps1

      - name: Validate marketplace
        run: claude plugin validate --strict .

      - name: Validate staged plugin
        run: claude plugin validate --strict dist/stage/onenote-mcp
