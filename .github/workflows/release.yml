name: release

# Story 1.11. Push a tag v<Version> (Directory.Build.props) on a commit that is on main.
# The build job refuses any other tag (AD-14), reruns every CI check on the tagged commit, and
# packs the release assets. The publish job uploads those exact bytes as a GitHub Release. The
# catalog in sentienceAdjacent/plugins pins it from there: its own sync workflow reads this repo's
# releases (AD-15). A version string is never reused (AD-19), so a failed release is retried with
# a new version, not by moving the tag.

on:
  push:
    tags: ['v*']

permissions: {}

# One group per tag, so quickly pushed tags never cancel each other's pending runs. Runs for
# different tags can finish out of order; the catalog's sync only ever moves its pin forward.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Semver, optionally with a prerelease suffix; no build metadata. Keep in sync with
  # scripts/pack-plugin.ps1 (PluginPackagingTests checks both, and the props, against this).
  VERSION_PATTERN: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?$'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      zip: ${{ steps.assets.outputs.zip }}
      zip-sha256: ${{ steps.assets.outputs.zip-sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the main-ancestry check needs history

      # Before anything is built: the tag must be exactly v<Version> (AD-14).
      - name: Check tag against <Version>
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $props = [xml](Get-Content -Raw Directory.Build.props)
          $version = "$($props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText)".Trim()
          if ($version -cnotmatch $env:VERSION_PATTERN) { throw "<Version> '$version' is not semver (with an optional prerelease suffix)." }
          if ($tag -cne "v$version") { throw "Tag '$tag' does not match <Version> '$version': expected 'v$version'." }
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing $version (prerelease: $prerelease)."

      # Only a commit already on main is released (release discipline, story 1.11).
      - name: Check the tagged commit is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tagged commit $env:GITHUB_SHA is not on main. Merge first, then tag." }

      # The same checks as ci.yml, run here on the tagged commit; this job doesn't rely on the CI run.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OneNoteMcp.slnx

      - name: Build
        run: dotnet build OneNoteMcp.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test tests/OneNoteMcp.Tests --no-build -c Release

      - name: Test (integration project, offline tests)
        run: dotnet test tests/OneNoteMcp.Integration --no-build -c Release

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Same pin as ci.yml (PluginPackagingTests checks they match).
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code@2.1.318

      - name: Pack plugin
        run: pwsh -NoProfile -File scripts/pack-plugin.ps1

      - name: Validate staged plugin
        run: claude plugin validate --strict dist/stage/onenote

      # The assets: the zip and its .sha256 from the pack script, the bare exe that is inside the
      # zip, and a .sha256 for it. Every hash is of these bytes; nothing is rebuilt after this.
      - name: Assemble release assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $zipName = "onenote-$version-win-x64.zip"
          $out = New-Item -ItemType Directory -Force dist/release
          Copy-Item "dist/$zipName", "dist/$zipName.sha256" $out
          Copy-Item dist/stage/onenote/OneNoteMcp.exe $out
          $exeHash = (Get-FileHash -Algorithm SHA256 (Join-Path $out OneNoteMcp.exe)).Hash.ToLowerInvariant()
          "$exeHash  OneNoteMcp.exe`n" | Set-Content -NoNewline -Encoding utf8NoBOM (Join-Path $out OneNoteMcp.exe.sha256)
          $zipHash = (Get-FileHash -Algorithm SHA256 (Join-Path $out $zipName)).Hash.ToLowerInvariant()
          $recorded = ((Get-Content -Raw (Join-Path $out "$zipName.sha256")) -split '\s+')[0]
          if ($recorded -cne $zipHash) { throw "The pack script's $zipName.sha256 ($recorded) does not match the zip ($zipHash)." }
          "zip=$zipName" >> $env:GITHUB_OUTPUT
          "zip-sha256=$zipHash" >> $env:GITHUB_OUTPUT
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes: it creates the release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      ZIP: ${{ needs.build.outputs.zip }}
      ZIP_SHA256: ${{ needs.build.outputs.zip-sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Verify the assets against their .sha256 files
        working-directory: assets
        run: |
          sha256sum -c "$ZIP.sha256" OneNoteMcp.exe.sha256
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$ZIP_SHA256"

      # AD-19: a version is never reused, so a deleted and re-pushed tag doesn't republish.
      - name: Refuse an existing release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists. Versions are never reused: release a new version."
            exit 1
          fi

      - name: Create the GitHub Release
        working-directory: assets
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" \
            "$ZIP" "$ZIP.sha256" OneNoteMcp.exe OneNoteMcp.exe.sha256

      # Hash what ships: download what GitHub now serves and check it against the hashes.
      - name: Verify the published assets
        run: |
          mkdir served
          gh release download "$TAG" --dir served
          cd served
          sha256sum -c "$ZIP.sha256" OneNoteMcp.exe.sha256
          test "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$ZIP_SHA256"
